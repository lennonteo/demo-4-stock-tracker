<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Café Stock Tracker</title>
<meta name="description" content="Multi-outlet stock tracker with low-stock alerts and a combined supplier order list.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='13' fill='%232f7d5b'/%3E%3Cpath d='M12 17h20v10a8 8 0 0 1-8 8h-4a8 8 0 0 1-8-8z' fill='%23fff'/%3E%3Cpath d='M32 20h2.5a4 4 0 0 1 0 8H32' stroke='%23fff' stroke-width='3' fill='none'/%3E%3Crect x='16' y='27' width='3' height='4' rx='1' fill='%232f7d5b'/%3E%3Crect x='20.5' y='24' width='3' height='7' rx='1' fill='%232f7d5b'/%3E%3Crect x='25' y='21' width='3' height='10' rx='1' fill='%232f7d5b'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f6f8fa;
    --surface: #ffffff;
    --border: #e3e8ee;
    --border-strong: #cfd7df;
    --text: #1a2233;
    --muted: #697386;
    --faint: #a3acb9;
    --accent: #e8590c;
    --brand: #2f7d5b;
    --accent-hover: #cc4d0a;
    --accent-soft: #fff1e8;
    --accent-line: #ffd4ba;
    --ok: #4f7a63;
    --ok-soft: #eef4f0;
    --danger: #b3261e;
    --radius: 14px;
    --shadow: 0 1px 2px rgba(26,34,51,.04), 0 2px 8px rgba(26,34,51,.04);
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 17px/1.5 Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  button, input { font: inherit; color: inherit; }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 32px 24px 64px; }

  /* Header */
  header { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 28px; }
  .brand { display: flex; align-items: center; gap: 16px; }
  .logo { width: 60px; height: 60px; flex: none; border-radius: 16px; box-shadow: 0 2px 8px rgba(47,125,91,.25); }
  h1 { font-size: 30px; line-height: 1.2; margin: 0 0 4px; font-weight: 700; letter-spacing: -.02em; }
  .sub { color: var(--muted); margin: 0; }
  .head-actions { display: flex; align-items: center; gap: 12px; }
  .status { color: var(--muted); font-size: 15px; }
  .status.err { color: var(--danger); }

  /* Buttons */
  .btn {
    border: 1px solid var(--border-strong); background: var(--surface); border-radius: 10px;
    padding: 10px 16px; font-weight: 600; font-size: 16px; cursor: pointer; white-space: nowrap;
    transition: background .15s, border-color .15s, color .15s;
  }
  .btn:hover { border-color: var(--muted); }
  .btn:focus-visible, .tab:focus-visible, .chip:focus-visible, .step:focus-visible, input:focus-visible {
    outline: 3px solid var(--accent-line); outline-offset: 1px;
  }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
  .btn:disabled { opacity: .45; cursor: default; }
  .btn.primary:disabled { background: var(--surface); border-color: var(--border-strong); color: var(--muted); opacity: 1; }

  /* KPI cards */
  .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 28px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); }
  .kpi { padding: 20px 22px; }
  .kpi .label { color: var(--muted); font-size: 15px; font-weight: 500; }
  .kpi .value { font-size: 34px; font-weight: 700; letter-spacing: -.02em; line-height: 1.2; margin-top: 6px; font-variant-numeric: tabular-nums; }
  .kpi .value.accent { color: var(--accent); }
  .kpi .note { color: var(--muted); font-size: 15px; margin-top: 2px; }

  /* Tabs */
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 20px; overflow-x: auto; scrollbar-width: none; }
  .tab {
    background: none; border: 0; border-bottom: 2px solid transparent; padding: 12px 16px; margin-bottom: -1px;
    font-weight: 600; font-size: 17px; color: var(--muted); cursor: pointer; white-space: nowrap;
    display: inline-flex; align-items: center; gap: 8px;
  }
  .tab:hover { color: var(--text); }
  .tab[aria-selected="true"] { color: var(--text); border-bottom-color: var(--accent); }
  .count { font-size: 13px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--bg); color: var(--muted); }
  .tab[aria-selected="true"] .count.has-low, .count.has-low { background: var(--accent-soft); color: var(--accent); }

  /* Toolbar */
  .toolbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip {
    border: 1px solid var(--border); background: var(--surface); border-radius: 999px; padding: 7px 14px;
    font-size: 15px; font-weight: 500; color: var(--muted); cursor: pointer;
  }
  .chip:hover { color: var(--text); border-color: var(--border-strong); }
  .chip[aria-pressed="true"] { background: var(--text); border-color: var(--text); color: #fff; }
  .toggle { display: inline-flex; align-items: center; gap: 8px; color: var(--muted); font-size: 15px; cursor: pointer; user-select: none; }
  .toggle input { width: 18px; height: 18px; accent-color: var(--accent); }

  /* Category cards */
  .group { margin-bottom: 20px; overflow: hidden; }
  .group-head { display: flex; justify-content: space-between; align-items: center; padding: 16px 22px; border-bottom: 1px solid var(--border); }
  .group-head h2 { font-size: 18px; margin: 0; font-weight: 600; }
  .group-head .meta { color: var(--muted); font-size: 15px; }
  .cols, .row { display: grid; grid-template-columns: minmax(0, 1fr) 190px 190px 110px; gap: 16px; align-items: center; padding: 0 22px; }
  .cols { color: var(--faint); font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; padding-top: 12px; padding-bottom: 4px; }
  .row { padding-top: 14px; padding-bottom: 14px; border-top: 1px solid var(--border); }
  .cols + .row { border-top: 0; }
  .row.low { background: linear-gradient(90deg, var(--accent-soft), transparent 55%); box-shadow: inset 3px 0 0 var(--accent); }
  .name { font-weight: 600; font-size: 18px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .detail { color: var(--muted); font-size: 15px; }
  .badge { font-size: 13px; font-weight: 700; letter-spacing: .03em; text-transform: uppercase; padding: 3px 9px; border-radius: 6px; background: var(--accent); color: #fff; }
  .badge.okb { background: var(--ok-soft); color: var(--ok); }
  .field-label { display: none; color: var(--faint); font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; margin-bottom: 4px; }

  /* Steppers */
  .stepper { display: inline-flex; align-items: center; border: 1px solid var(--border-strong); border-radius: 10px; background: var(--surface); overflow: hidden; }
  .stepper.dirty { border-color: var(--accent); }
  .step { width: 44px; height: 44px; border: 0; background: none; font-size: 22px; cursor: pointer; color: var(--muted); }
  .step:hover { background: var(--bg); color: var(--text); }
  .stepper input {
    width: 64px; height: 44px; border: 0; border-left: 1px solid var(--border); border-right: 1px solid var(--border);
    text-align: center; font-size: 19px; font-weight: 600; font-variant-numeric: tabular-nums; -moz-appearance: textfield; background: none;
  }
  .stepper input::-webkit-outer-spin-button, .stepper input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

  /* Order list */
  .order-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 16px; align-items: center; padding: 16px 22px; border-top: 1px solid var(--border); }
  .group-head + .order-row { border-top: 0; }
  .split { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
  .pill { font-size: 14px; padding: 3px 10px; border-radius: 999px; background: var(--bg); color: var(--muted); border: 1px solid var(--border); }
  .qty { font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; text-align: right; line-height: 1.2; }
  .qty small { display: block; font-size: 15px; font-weight: 500; color: var(--muted); }
  .order-foot { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; padding: 18px 22px; }
  .hint { color: var(--muted); font-size: 15px; margin: 0 0 20px; }

  .empty { padding: 48px 22px; text-align: center; color: var(--muted); }
  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 20px); opacity: 0; pointer-events: none;
    background: var(--text); color: #fff; padding: 12px 18px; border-radius: 10px; font-weight: 500; transition: .2s; z-index: 10; max-width: calc(100% - 32px);
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  .toast.err { background: var(--danger); }

  /* Forms */
  .field { display: grid; gap: 6px; margin-bottom: 16px; }
  .field label { font-size: 15px; font-weight: 600; }
  .field input, .field select {
    height: 48px; padding: 0 14px; border: 1px solid var(--border-strong); border-radius: 10px;
    background: var(--surface); font-size: 17px; width: 100%;
  }
  .field input:focus, .field select:focus { outline: 3px solid var(--accent-line); outline-offset: 1px; border-color: var(--accent); }
  .field .help { color: var(--muted); font-size: 14px; }
  .form-error { color: var(--danger); font-size: 15px; min-height: 22px; margin: -4px 0 12px; }
  .btn.block { width: 100%; height: 48px; }

  /* Sign-in screen */
  .login { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; }
  .login .card { width: 100%; max-width: 420px; padding: 36px 32px 28px; }
  .login .logo { margin-bottom: 20px; }
  .login h1 { font-size: 26px; margin-bottom: 4px; }
  .login .sub { margin-bottom: 28px; }

  /* Account menu */
  .account { position: relative; }
  .account summary {
    list-style: none; display: inline-flex; align-items: center; gap: 10px; cursor: pointer;
    border: 1px solid var(--border-strong); background: var(--surface); border-radius: 999px; padding: 5px 14px 5px 5px; font-weight: 600; font-size: 16px;
  }
  .account summary::-webkit-details-marker { display: none; }
  .account summary:hover { border-color: var(--muted); }
  .account summary:focus-visible { outline: 3px solid var(--accent-line); outline-offset: 1px; }
  .avatar { width: 34px; height: 34px; border-radius: 50%; background: var(--brand); color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 15px; text-transform: uppercase; }
  .menu {
    position: absolute; right: 0; top: calc(100% + 8px); min-width: 220px; z-index: 5; padding: 6px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px; box-shadow: 0 8px 24px rgba(26,34,51,.12);
  }
  .menu .who { padding: 10px 12px; border-bottom: 1px solid var(--border); margin-bottom: 6px; }
  .menu .who .detail { font-size: 14px; }
  .menu button { display: block; width: 100%; text-align: left; background: none; border: 0; padding: 10px 12px; border-radius: 8px; cursor: pointer; font-size: 16px; }
  .menu button:hover { background: var(--bg); }
  .role { font-size: 12px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; padding: 2px 8px; border-radius: 6px; background: var(--ok-soft); color: var(--ok); }
  .role.admin { background: var(--text); color: #fff; }

  /* Users tab */
  .users-grid { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 20px; align-items: start; }
  .user-row { display: flex; align-items: center; gap: 14px; padding: 14px 22px; border-top: 1px solid var(--border); }
  .group-head + .user-row { border-top: 0; }
  .user-row .grow { flex: 1; min-width: 0; }
  .form-body { padding: 20px 22px 6px; }

  /* Dialog */
  dialog { border: 0; border-radius: var(--radius); padding: 0; width: min(440px, calc(100% - 32px)); box-shadow: 0 20px 60px rgba(26,34,51,.25); color: var(--text); }
  dialog::backdrop { background: rgba(26,34,51,.4); }
  dialog form { padding: 28px 28px 22px; }
  dialog h2 { margin: 0 0 6px; font-size: 22px; }
  dialog .actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 8px; }

  @media (max-width: 860px) {
    .users-grid { grid-template-columns: 1fr; }
    .kpis { grid-template-columns: repeat(2, 1fr); }
    .cols { display: none; }
    .row { grid-template-columns: 1fr 1fr; row-gap: 12px; }
    .row > .item { grid-column: 1 / -1; }
    .row > .save { grid-column: 1 / -1; }
    .row > .save .btn { width: 100%; }
    .field-label { display: block; }
  }
  @media (max-width: 520px) {
    .wrap { padding: 20px 16px 48px; }
    h1 { font-size: 26px; }
    .brand { gap: 12px; }
    .logo { width: 48px; height: 48px; border-radius: 13px; }
    .kpi { padding: 16px; }
    .kpi .value { font-size: 28px; }
    .group-head, .row, .order-row, .order-foot { padding-left: 16px; padding-right: 16px; }
    .row { grid-template-columns: 1fr; }
    .step { width: 48px; }
    .stepper input { width: 100%; flex: 1; }
    .stepper { display: flex; }
  }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="logo-mark" viewBox="0 0 48 48">
    <rect width="48" height="48" rx="13" fill="var(--brand)"/>
    <path d="M18.5 13.5c0-2 2-2.5 2-4.5M24.5 13.5c0-2 2-2.5 2-4.5" stroke="#fff" stroke-width="2" stroke-linecap="round" fill="none" opacity=".75"/>
    <path d="M12 17h20v10a8 8 0 0 1-8 8h-4a8 8 0 0 1-8-8z" fill="#fff"/>
    <path d="M32 20h2.5a4 4 0 0 1 0 8H32" stroke="#fff" stroke-width="3" fill="none"/>
    <rect x="16" y="27" width="3" height="4" rx="1" fill="var(--brand)"/>
    <rect x="20.5" y="24" width="3" height="7" rx="1" fill="var(--brand)"/>
    <rect x="25" y="21" width="3" height="10" rx="1" fill="var(--brand)"/>
  </symbol>
</svg>

<!-- Sign-in screen -->
<div class="login" id="login" hidden>
  <form class="card" id="loginForm" novalidate>
    <svg class="logo" role="img" aria-label="Stock tracker logo"><use href="#logo-mark"/></svg>
    <h1>Sign in</h1>
    <p class="sub">Café stock tracker for Jurong, Orchard and Tampines.</p>
    <div class="field">
      <label for="loginUser">Username</label>
      <input id="loginUser" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required>
    </div>
    <div class="field">
      <label for="loginPass">Password</label>
      <input id="loginPass" name="password" type="password" autocomplete="current-password" required>
    </div>
    <div class="form-error" id="loginError" role="alert"></div>
    <button class="btn primary block" type="submit" id="loginBtn">Sign in</button>
  </form>
</div>

<!-- App (shown once signed in) -->
<div class="wrap" id="app" hidden>
  <header>
    <div class="brand">
      <svg class="logo" role="img" aria-label="Stock tracker logo"><use href="#logo-mark"/></svg>
      <div>
        <h1>Stock tracker</h1>
        <p class="sub" id="sub">Loading stock from Supabase…</p>
      </div>
    </div>
    <div class="head-actions">
      <span class="status" id="status"></span>
      <button class="btn" id="refresh" type="button">Refresh</button>
      <details class="account" id="account">
        <summary><span class="avatar" id="avatar"></span><span id="whoName"></span></summary>
        <div class="menu">
          <div class="who"><strong id="menuName"></strong> <span class="role" id="menuRole"></span><div class="detail">Signed in</div></div>
          <button type="button" id="changePw">Change password</button>
          <button type="button" id="signOut">Sign out</button>
        </div>
      </details>
    </div>
  </header>

  <section class="kpis" id="kpis" aria-label="Summary"></section>
  <nav class="tabs" role="tablist" id="tabs"></nav>
  <main id="view"></main>
</div>

<dialog id="pwDialog">
  <form id="pwForm" novalidate>
    <h2>Change password</h2>
    <p class="sub" style="margin-bottom:20px">Use at least 8 characters.</p>
    <div class="field">
      <label for="pwNew">New password</label>
      <input id="pwNew" type="password" autocomplete="new-password" minlength="8" required>
    </div>
    <div class="field">
      <label for="pwConfirm">Confirm new password</label>
      <input id="pwConfirm" type="password" autocomplete="new-password" minlength="8" required>
    </div>
    <div class="form-error" id="pwError" role="alert"></div>
    <div class="actions">
      <button class="btn" type="button" id="pwCancel">Cancel</button>
      <button class="btn primary" type="submit" id="pwSave">Update password</button>
    </div>
  </form>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL = 'https://svurfhnswvgunjhkwedx.supabase.co';
const SUPABASE_KEY = 'sb_publishable_7KIqnHr1NEI7OTGN_91plg_v1UFUAhw';
// Usernames sign in through Supabase Auth, which needs an email; this domain is reserved and never receives mail
const EMAIL_DOMAIN = 'stocktracker.example.com';
const CATEGORY_ORDER = ['Coffee', 'Dairy', 'Powders & syrups', 'Bakery', 'Packaging'];
const ORDER_TAB = '__order';
const USERS_TAB = '__users';

// Keep the session in sessionStorage: it survives a refresh but is cleared when the tab or browser closes,
// so leaving the app signs the user out. Remove any session saved by the older localStorage version.
try { Object.keys(localStorage).filter(k => /^sb-.*-auth-token/.test(k)).forEach(k => localStorage.removeItem(k)); } catch {}
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
  auth: { storage: window.sessionStorage, persistSession: true, autoRefreshToken: true }
});
const state = { me: null, users: [], rows: [], outlets: [], tab: null, category: 'All', lowOnly: false, drafts: {}, saving: {}, addingUser: false };
const $ = sel => document.querySelector(sel);
const toEmail = u => (u.includes('@') ? u : `${u}@${EMAIL_DOMAIN}`).trim().toLowerCase();

/* ---------- Auth ---------- */

async function signIn(e) {
  e.preventDefault();
  const username = $('#loginUser').value.trim().toLowerCase();
  const password = $('#loginPass').value;
  const err = $('#loginError');
  if (!username || !password) { err.textContent = 'Enter your username and password.'; return; }
  err.textContent = '';
  $('#loginBtn').disabled = true; $('#loginBtn').textContent = 'Signing in…';
  const { data, error } = await sb.auth.signInWithPassword({ email: toEmail(username), password });
  $('#loginBtn').disabled = false; $('#loginBtn').textContent = 'Sign in';
  if (error) {
    err.textContent = /invalid/i.test(error.message) ? 'Wrong username or password.' : error.message;
    $('#loginPass').select();
    return;
  }
  $('#loginPass').value = '';
  await startApp(data.session);
}

async function signOut() {
  if (Object.keys(state.drafts).length && !confirm('You have unsaved changes. Sign out anyway?')) return;
  $('#account').open = false;
  await sb.auth.signOut();
  showLogin();
}

function showLogin(message) {
  Object.assign(state, { me: null, users: [], rows: [], outlets: [], tab: null, drafts: {}, saving: {} });
  $('#app').hidden = true;
  $('#login').hidden = false;
  $('#loginError').textContent = message || '';
  document.title = 'Sign in · Café Stock Tracker';
  $('#loginUser').focus();
}

async function startApp(session) {
  const { data: me, error } = await sb.from('profiles').select('id, username, role').eq('id', session.user.id).single();
  if (error || !me) { await sb.auth.signOut(); showLogin('This account has no profile. Ask an admin to check it.'); return; }
  state.me = me;
  $('#login').hidden = true;
  $('#app').hidden = false;
  document.title = 'Café Stock Tracker';
  $('#avatar').textContent = me.username[0];
  $('#whoName').textContent = me.username;
  $('#menuName').textContent = me.username;
  $('#menuRole').textContent = me.role;
  $('#menuRole').className = `role ${me.role}`;
  await load();
}

async function changePassword(e) {
  e.preventDefault();
  const pw = $('#pwNew').value, confirmPw = $('#pwConfirm').value, err = $('#pwError');
  if (pw.length < 8) { err.textContent = 'Use at least 8 characters.'; return; }
  if (pw !== confirmPw) { err.textContent = 'The two passwords do not match.'; return; }
  $('#pwSave').disabled = true;
  const { error } = await sb.auth.updateUser({ password: pw });
  $('#pwSave').disabled = false;
  if (error) { err.textContent = error.message; return; }
  $('#pwDialog').close();
  toast('Password updated');
}

/* ---------- Users (admin) ---------- */

async function loadUsers() {
  const { data, error } = await sb.from('profiles').select('id, username, role, created_at').order('username');
  if (error) throw error;
  state.users = data;
}

async function addUser(e) {
  e.preventDefault();
  const f = e.target, err = $('#userError');
  const username = f.username.value.trim().toLowerCase();
  const password = f.password.value;
  if (!/^[a-z0-9_-]{3,30}$/.test(username)) { err.textContent = 'Username: 3–30 lowercase letters, numbers, - or _.'; return; }
  if (password.length < 8) { err.textContent = 'Initial password must be at least 8 characters.'; return; }
  err.textContent = '';
  state.addingUser = true; f.querySelector('button[type=submit]').disabled = true;
  const { data, error } = await sb.functions.invoke('create-user', { body: { username, password, role: f.role.value } });
  state.addingUser = false;
  if (error) {
    const msg = await error.context?.json?.().then(b => b.error).catch(() => null);
    err.textContent = msg || error.message;
    f.querySelector('button[type=submit]').disabled = false;
    return;
  }
  toast(`Added ${data.username}. They can sign in now.`);
  await loadUsers();
  render();
}

/* ---------- Stock data ---------- */

async function load() {
  setStatus('Loading…');
  try {
    const { data, error } = await sb.from('stock_counts')
      .select('id, outlet, sku, qty_on_hand, reorder_level, counted_at, updated_at, editor:profiles(username), items(item_name, unit, category)')
      .order('counted_at', { ascending: false });
    if (error) throw error;
    if (state.me.role === 'admin') await loadUsers();
    // Keep only the most recent count per outlet + item
    const latest = new Map();
    for (const r of data) {
      const key = `${r.outlet}|${r.sku}`;
      if (!latest.has(key)) latest.set(key, {
        id: r.id, outlet: r.outlet, sku: r.sku, qty: r.qty_on_hand, reorder: r.reorder_level,
        countedAt: r.counted_at, updatedAt: r.updated_at, editor: r.editor?.username || null,
        name: r.items.item_name, unit: r.items.unit, category: r.items.category
      });
    }
    state.rows = [...latest.values()].sort((a, b) => a.sku.localeCompare(b.sku) || a.outlet.localeCompare(b.outlet));
    state.outlets = [...new Set(state.rows.map(r => r.outlet))].sort();
    const special = state.tab === ORDER_TAB || (state.tab === USERS_TAB && state.me.role === 'admin');
    if (!state.tab || (!special && !state.outlets.includes(state.tab))) state.tab = state.outlets[0] || ORDER_TAB;
    state.drafts = {};
    setStatus('');
    render();
  } catch (e) {
    if (await sessionExpired()) return;
    setStatus('Could not load data', true);
    $('#sub').textContent = e.message;
  }
}

async function sessionExpired() {
  const { data } = await sb.auth.getSession();
  if (data.session) return false;
  showLogin('Your session has ended. Please sign in again.');
  return true;
}

async function saveRow(id) {
  const row = state.rows.find(r => r.id === id);
  const d = state.drafts[id];
  if (!row || !d) return;
  if (!valid(d.qty) || !valid(d.reorder)) return toast('Enter whole numbers of 0 or more', true);
  state.saving[id] = true; render();
  try {
    const { data: out, error } = await sb.from('stock_counts')
      .update({ qty_on_hand: d.qty, reorder_level: d.reorder })
      .eq('id', id)
      .select('qty_on_hand, reorder_level, updated_at');
    if (error) throw error;
    if (!out.length) throw new Error('Supabase did not accept the change');
    Object.assign(row, { qty: out[0].qty_on_hand, reorder: out[0].reorder_level, updatedAt: out[0].updated_at, editor: state.me.username });
    delete state.drafts[id];
    toast(`Saved ${row.name} · ${row.outlet}`);
  } catch (e) {
    if (await sessionExpired()) return;
    toast(`Not saved: ${e.message}`, true);
  } finally {
    delete state.saving[id]; render();
  }
}

const valid = n => Number.isInteger(n) && n >= 0;
const current = r => state.drafts[r.id] || { qty: r.qty, reorder: r.reorder };
const isLow = (qty, reorder) => qty <= reorder;
const shortfall = (qty, reorder) => Math.max(reorder - qty, 0);
const plural = (n, unit) => n === 1 ? unit : (/(x|s|ch|sh)$/.test(unit) ? unit + 'es' : unit + 's');
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const catSort = (a, b) => (CATEGORY_ORDER.indexOf(a) + 1 || 99) - (CATEGORY_ORDER.indexOf(b) + 1 || 99) || a.localeCompare(b);
const fmtDate = s => new Date(s + 'T00:00:00').toLocaleDateString('en-SG', { day: 'numeric', month: 'short', year: 'numeric' });

function orderLines() {
  const byItem = new Map();
  for (const r of state.rows) {
    const s = shortfall(r.qty, r.reorder);
    if (!s) continue;
    if (!byItem.has(r.sku)) byItem.set(r.sku, { sku: r.sku, name: r.name, unit: r.unit, category: r.category, total: 0, split: [] });
    const line = byItem.get(r.sku);
    line.total += s;
    line.split.push({ outlet: r.outlet, qty: s });
  }
  return [...byItem.values()];
}

function render() {
  const lowCount = state.rows.filter(r => isLow(r.qty, r.reorder)).length;
  const lines = orderLines();
  const units = lines.reduce((t, l) => t + l.total, 0);
  const perOutlet = state.outlets.map(o => ({ o, n: state.rows.filter(r => r.outlet === o && isLow(r.qty, r.reorder)).length }));
  const worst = perOutlet.reduce((a, b) => (b.n > a.n ? b : a), { o: '—', n: 0 });
  const dates = [...new Set(state.rows.map(r => r.countedAt))].sort();
  const lastRow = state.rows.reduce((m, r) => (!m || r.updatedAt > m.updatedAt ? r : m), null);
  const lastEdit = lastRow?.updatedAt || '';

  $('#sub').textContent = `${state.outlets.length} outlets · ${new Set(state.rows.map(r => r.sku)).size} items · counted ${dates.length ? fmtDate(dates[dates.length - 1]) : '—'}`;

  $('#kpis').innerHTML = `
    <div class="card kpi"><div class="label">Items low</div><div class="value accent">${lowCount}</div><div class="note">of ${state.rows.length} across all outlets</div></div>
    <div class="card kpi"><div class="label">Units to order</div><div class="value">${units}</div><div class="note">${lines.length} products short</div></div>
    <div class="card kpi"><div class="label">Most at risk</div><div class="value">${esc(worst.o)}</div><div class="note">${worst.n} items low</div></div>
    <div class="card kpi"><div class="label">Last saved</div><div class="value" style="font-size:24px;padding-top:6px">${lastEdit ? new Date(lastEdit).toLocaleTimeString('en-SG', { hour: 'numeric', minute: '2-digit' }) : '—'}</div><div class="note">${lastEdit ? new Date(lastEdit).toLocaleDateString('en-SG', { day: 'numeric', month: 'short' }) + (lastRow.editor ? ` · by ${esc(lastRow.editor)}` : '') : ''}</div></div>`;

  const tabs = [...perOutlet.map(p => ({ id: p.o, label: p.o, n: p.n })), { id: ORDER_TAB, label: 'Order from suppliers', n: lines.length }];
  if (state.me.role === 'admin') tabs.push({ id: USERS_TAB, label: 'Users', n: state.users.length, plain: true });
  $('#tabs').innerHTML = tabs.map(t => `
    <button class="tab" role="tab" type="button" data-tab="${esc(t.id)}" aria-selected="${t.id === state.tab}">
      ${esc(t.label)} <span class="count ${t.n && !t.plain ? 'has-low' : ''}">${t.n}</span>
    </button>`).join('');

  $('#view').innerHTML =
    state.tab === ORDER_TAB ? renderOrder(lines, units) :
    state.tab === USERS_TAB ? renderUsers() :
    renderOutlet(state.tab);
}

function renderUsers() {
  const fmt = s => new Date(s).toLocaleDateString('en-SG', { day: 'numeric', month: 'short', year: 'numeric' });
  return `
    <div class="users-grid">
      <section class="card group">
        <div class="group-head"><h2>Team</h2><span class="meta">${state.users.length} users</span></div>
        ${state.users.map(u => `
          <div class="user-row">
            <span class="avatar">${esc(u.username[0])}</span>
            <div class="grow">
              <div class="name">${esc(u.username)}${u.id === state.me.id ? ' <span class="detail">(you)</span>' : ''}</div>
              <div class="detail">Added ${fmt(u.created_at)}</div>
            </div>
            <span class="role ${u.role}">${esc(u.role)}</span>
          </div>`).join('')}
      </section>
      <section class="card group">
        <div class="group-head"><h2>Add user</h2></div>
        <form class="form-body" id="userForm" novalidate>
          <div class="field">
            <label for="newUser">Username</label>
            <input id="newUser" name="username" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="e.g. mango">
            <span class="help">Lowercase letters, numbers, - or _</span>
          </div>
          <div class="field">
            <label for="newPass">Initial password</label>
            <input id="newPass" name="password" type="text" autocomplete="off" placeholder="At least 8 characters">
            <span class="help">Share it with them; they can change it from their account menu.</span>
          </div>
          <div class="field">
            <label for="newRole">Role</label>
            <select id="newRole" name="role">
              <option value="staff">Staff – view and update stock</option>
              <option value="admin">Admin – also manage users</option>
            </select>
          </div>
          <div class="form-error" id="userError" role="alert"></div>
          <button class="btn primary block" type="submit" ${state.addingUser ? 'disabled' : ''}>Add user</button>
          <div style="height:16px"></div>
        </form>
      </section>
    </div>`;
}

function renderOutlet(outlet) {
  const rows = state.rows.filter(r => r.outlet === outlet);
  const cats = [...new Set(rows.map(r => r.category))].sort(catSort);
  if (state.category !== 'All' && !cats.includes(state.category)) state.category = 'All';

  const toolbar = `
    <div class="toolbar">
      <div class="chips" role="group" aria-label="Category">
        ${['All', ...cats].map(c => `<button class="chip" type="button" data-cat="${esc(c)}" aria-pressed="${c === state.category}">${esc(c)}</button>`).join('')}
      </div>
      <label class="toggle"><input type="checkbox" id="lowOnly" ${state.lowOnly ? 'checked' : ''}> Show low items only</label>
    </div>`;

  const groups = cats
    .filter(c => state.category === 'All' || c === state.category)
    .map(c => {
      const items = rows.filter(r => r.category === c && (!state.lowOnly || isLow(current(r).qty, current(r).reorder)));
      if (!items.length) return '';
      const low = items.filter(r => isLow(current(r).qty, current(r).reorder)).length;
      return `
        <section class="card group">
          <div class="group-head"><h2>${esc(c)}</h2><span class="meta">${low ? `${low} low` : 'All stocked'}</span></div>
          <div class="cols"><span>Item</span><span>In stock</span><span>Reorder at</span><span></span></div>
          ${items.map(renderRow).join('')}
        </section>`;
    }).join('');

  return toolbar + (groups || `<div class="card empty">No low items in ${esc(outlet)}${state.category !== 'All' ? ` for ${esc(state.category)}` : ''}.</div>`);
}

function renderRow(r) {
  const { qty, reorder } = current(r);
  const dirty = !!state.drafts[r.id];
  const low = isLow(qty, reorder);
  const short = shortfall(qty, reorder);
  const saving = !!state.saving[r.id];
  const stepper = (field, val, label) => `
    <div>
      <div class="field-label">${label}</div>
      <div class="stepper ${dirty && val !== r[field] ? 'dirty' : ''}">
        <button class="step" type="button" data-id="${r.id}" data-field="${field}" data-delta="-1" aria-label="Decrease ${label.toLowerCase()} for ${esc(r.name)}">−</button>
        <input type="number" min="0" step="1" inputmode="numeric" value="${val}" data-id="${r.id}" data-field="${field}" aria-label="${label} for ${esc(r.name)}">
        <button class="step" type="button" data-id="${r.id}" data-field="${field}" data-delta="1" aria-label="Increase ${label.toLowerCase()} for ${esc(r.name)}">+</button>
      </div>
    </div>`;
  return `
    <div class="row ${low ? 'low' : ''}">
      <div class="item">
        <div class="name">${esc(r.name)} ${low ? '<span class="badge">Low</span>' : ''}</div>
        <div class="detail">${esc(r.sku)} · per ${esc(r.unit)}${short ? ` · short by ${short}` : ''}</div>
      </div>
      ${stepper('qty', qty, 'In stock')}
      ${stepper('reorder', reorder, 'Reorder at')}
      <div class="save"><button class="btn primary" type="button" data-save="${r.id}" ${dirty && !saving ? '' : 'disabled'}>${saving ? 'Saving…' : 'Save'}</button></div>
    </div>`;
}

function renderOrder(lines, units) {
  if (!lines.length) return `<div class="card empty">Nothing to order. Every outlet is above its reorder level.</div>`;
  const cats = [...new Set(lines.map(l => l.category))].sort(catSort);
  return `
    <p class="hint">Shortfall = reorder level minus stock on hand, totalled across all outlets. Items sitting exactly at their reorder level are marked Low but have nothing to order.</p>
    ${cats.map(c => {
      const ls = lines.filter(l => l.category === c);
      return `
        <section class="card group">
          <div class="group-head"><h2>${esc(c)}</h2><span class="meta">${ls.length} ${ls.length === 1 ? 'product' : 'products'}</span></div>
          ${ls.map(l => `
            <div class="order-row">
              <div>
                <div class="name">${esc(l.name)}</div>
                <div class="split">${l.split.map(s => `<span class="pill">${esc(s.outlet)} ${s.qty}</span>`).join('')}</div>
              </div>
              <div class="qty">${l.total}<small>${esc(plural(l.total, l.unit))}</small></div>
            </div>`).join('')}
        </section>`;
    }).join('')}
    <section class="card">
      <div class="order-foot">
        <div><strong style="font-size:20px">${units} units</strong> <span class="detail">across ${lines.length} products</span></div>
        <button class="btn primary" type="button" id="copy">Copy order list</button>
      </div>
    </section>`;
}

function orderText() {
  const lines = orderLines();
  const cats = [...new Set(lines.map(l => l.category))].sort(catSort);
  const today = new Date().toLocaleDateString('en-SG', { day: 'numeric', month: 'short', year: 'numeric' });
  const out = [`Supplier order – ${today}`, ''];
  for (const c of cats) {
    out.push(c.toUpperCase());
    for (const l of lines.filter(x => x.category === c)) {
      out.push(`- ${l.name}: ${l.total} ${plural(l.total, l.unit)} (${l.split.map(s => `${s.outlet} ${s.qty}`).join(', ')})`);
    }
    out.push('');
  }
  out.push(`Total: ${lines.reduce((t, l) => t + l.total, 0)} units across ${lines.length} products`);
  return out.join('\n');
}

async function copyOrder() {
  const text = orderText();
  try {
    await navigator.clipboard.writeText(text);
  } catch {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    const ok = document.execCommand('copy'); ta.remove();
    if (!ok) return toast('Copy failed – select the list and copy manually', true);
  }
  toast('Order list copied');
}

function setDraft(id, field, value) {
  const row = state.rows.find(r => r.id === id);
  const d = { ...current(row), [field]: value };
  if (d.qty === row.qty && d.reorder === row.reorder) delete state.drafts[id];
  else state.drafts[id] = d;
}

// Events (delegated, since the view re-renders)
document.addEventListener('click', e => {
  const t = e.target.closest('button');
  if (!t) return;
  if (t.dataset.tab) { state.tab = t.dataset.tab; state.category = 'All'; render(); return; }
  if (t.dataset.cat) { state.category = t.dataset.cat; render(); return; }
  if (t.dataset.delta) {
    const id = +t.dataset.id, f = t.dataset.field;
    const row = state.rows.find(r => r.id === id);
    setDraft(id, f, Math.max(0, current(row)[f] + +t.dataset.delta));
    render();
    document.querySelector(`button[data-id="${id}"][data-field="${f}"][data-delta="${t.dataset.delta}"]`)?.focus();
    return;
  }
  if (t.dataset.save) { saveRow(+t.dataset.save); return; }
  if (t.id === 'copy') { copyOrder(); return; }
  if (t.id === 'refresh') {
    if (Object.keys(state.drafts).length && !confirm('Discard unsaved changes and reload?')) return;
    load();
    return;
  }
  if (t.id === 'signOut') { signOut(); return; }
  if (t.id === 'changePw') {
    $('#account').open = false;
    $('#pwForm').reset(); $('#pwError').textContent = '';
    $('#pwDialog').showModal();
    return;
  }
  if (t.id === 'pwCancel') { $('#pwDialog').close(); }
});
document.addEventListener('submit', e => {
  if (e.target.id === 'loginForm') signIn(e);
  else if (e.target.id === 'pwForm') changePassword(e);
  else if (e.target.id === 'userForm') addUser(e);
});
// Close the account menu when clicking elsewhere
document.addEventListener('click', e => { if (!e.target.closest('#account')) $('#account').open = false; });
document.addEventListener('change', e => {
  if (e.target.id === 'lowOnly') { state.lowOnly = e.target.checked; render(); }
});
// Typed edits update the row in place (a full re-render on blur would swallow the Save click)
document.addEventListener('input', e => {
  if (!e.target.matches('.stepper input')) return;
  const id = +e.target.dataset.id, field = e.target.dataset.field;
  const v = parseInt(e.target.value, 10);
  const row = state.rows.find(r => r.id === id);
  setDraft(id, field, Number.isNaN(v) ? row[field] : Math.max(0, v));
  const rowEl = e.target.closest('.row');
  e.target.closest('.stepper').classList.toggle('dirty', current(row)[field] !== row[field]);
  rowEl.querySelector('[data-save]').disabled = !state.drafts[id];
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.matches('.stepper input')) {
    const id = +e.target.dataset.id;
    setDraft(id, e.target.dataset.field, Math.max(0, parseInt(e.target.value, 10) || 0));
    saveRow(id);
  }
});
window.addEventListener('beforeunload', e => { if (Object.keys(state.drafts).length) { e.preventDefault(); e.returnValue = ''; } });

let toastTimer;
function toast(msg, err) {
  const el = $('#toast');
  el.textContent = msg; el.className = `toast show${err ? ' err' : ''}`;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => (el.className = 'toast'), 2600);
}
function setStatus(msg, err) { const el = $('#status'); el.textContent = msg; el.className = `status${err ? ' err' : ''}`; }

// Sign-out in another tab, or an expired refresh token, returns to the sign-in screen
sb.auth.onAuthStateChange(event => {
  if (event === 'SIGNED_OUT' && state.me) setTimeout(() => showLogin('You have been signed out.'), 0);
});

(async () => {
  const { data } = await sb.auth.getSession();
  if (data.session) await startApp(data.session);
  else showLogin();
})();
</script>
</body>
